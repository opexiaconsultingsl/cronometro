<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP60 - Cronómetro Dulca</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4202A">

<style>
:root {
    --dulca-red: #C4202A;
    --dulca-dark-red: #931820;
    --dulca-orange: #EF7622;
    --dulca-bg: #FAF4EF;
    --dulca-white: #FFFFFF;
    --dulca-dark: #221516;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(239,118,34,0.28), transparent 35%),
        linear-gradient(135deg, var(--dulca-red), var(--dulca-dark-red));
    color: var(--dulca-white);
    text-align: center;
    overflow: hidden;
}

.app {
    min-height: 100vh;
    padding: 24px 36px;
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-card {
    background: var(--dulca-white);
    border-radius: 24px;
    padding: 14px 24px;
    min-width: 230px;
    height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.22);
}

.logo-card img {
    max-width: 210px;
    max-height: 75px;
    object-fit: contain;
}

.logo-placeholder {
    color: var(--dulca-red);
    font-size: 24px;
    font-weight: 900;
}

.clock-card {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.28);
    backdrop-filter: blur(8px);
    border-radius: 22px;
    padding: 18px 28px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.18);
}

.clock-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
}

.clock {
    font-size: 42px;
    font-weight: 900;
}

.title {
    margin-top: 24px;
}

.title h1 {
    margin: 0;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 1px;
}

.title p {
    margin: 8px 0 0;
    font-size: 24px;
    opacity: 0.86;
}

.main-card {
    margin: 26px auto 0;
    width: min(1150px, 96vw);
    background: rgba(255,255,255,0.94);
    color: var(--dulca-dark);
    border-radius: 38px;
    padding: 28px 34px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.32);
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    font-size: 24px;
    font-weight: 800;
    color: var(--dulca-dark-red);
}

input {
    width: 96px;
    padding: 10px;
    border: 3px solid #F0D4C6;
    border-radius: 14px;
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    color: var(--dulca-red);
    background: #FFF8F4;
}

.timer {
    margin-top: 14px;
    font-size: clamp(120px, 18vw, 215px);
    line-height: 1;
    font-weight: 900;
    color: var(--dulca-red);
    text-shadow: 0 8px 0 rgba(239,118,34,0.18);
}

.overtime {
    color: var(--dulca-orange);
}

.blink {
    animation: blink 0.5s infinite;
    color: var(--dulca-orange);
}

@keyframes blink {
    50% { opacity: 0.15; transform: scale(1.015); }
}

.status {
    margin-top: 8px;
    font-size: 36px;
    font-weight: 900;
    color: var(--dulca-dark-red);
}

.buttons {
    margin-top: 26px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
}

button {
    border: none;
    border-radius: 18px;
    padding: 18px 28px;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.25);
}

.start {
    background: var(--dulca-red);
    color: white;
}

.reset {
    background: var(--dulca-orange);
    color: white;
}

.mute {
    background: #3B2A2B;
    color: white;
}

.fullscreen {
    background: white;
    color: var(--dulca-red);
    border: 3px solid var(--dulca-red);
}

.footer {
    margin-top: auto;
    padding-top: 18px;
    font-size: 17px;
    opacity: 0.8;
}

@media (max-width: 800px) {
    .header {
        gap: 12px;
    }

    .logo-card {
        min-width: 160px;
        height: 75px;
    }

    .clock {
        font-size: 28px;
    }

    .title h1 {
        font-size: 38px;
    }

    .main-card {
        padding: 22px;
    }

    .controls {
        flex-wrap: wrap;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo-card">
            <!-- Cambia logo-dulca.png por el nombre real de tu archivo -->
            <img src="logo-dulca.png" alt="Logo Dulca" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
            <div id="logoFallback" class="logo-placeholder" style="display:none;">Dulca</div>
        </div>

        <div class="clock-card">
            <div class="clock-label">Hora actual</div>
            <div class="clock" id="clock">--:--:--</div>
        </div>
    </div>

    <div class="title">
        <h1>TOP60</h1>
        <p>Cronómetro de intervenciones</p>
    </div>

    <div class="main-card">

        <div class="controls">
            <span>Tiempo objetivo:</span>
            <input type="number" id="minutesInput" value="5" min="0">
            <span>min</span>
            <input type="number" id="secondsInput" value="0" min="0" max="59">
            <span>seg</span>
        </div>

        <div class="timer" id="timer">05:00</div>
        <div class="status" id="status">Preparado</div>

        <div class="buttons">
            <button class="start" onclick="toggleTimer()">▶ Iniciar / Pausar</button>
            <button class="reset" onclick="resetTimer()">⟲ Reiniciar</button>
            <button class="mute" onclick="toggleMute()" id="muteBtn">🔊 Sonido ON</button>
            <button class="fullscreen" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
        </div>

    </div>

    <div class="footer">
        Espacio = iniciar/pausar · R = reiniciar · F = pantalla completa · M = silenciar
    </div>

</div>

<script>
let totalSeconds = 300;
let remainingSeconds = 300;
let interval = null;
let muted = false;
let alarmPlayed = false;

const timerDisplay = document.getElementById("timer");
const statusDisplay = document.getElementById("status");
const minutesInput = document.getElementById("minutesInput");
const secondsInput = document.getElementById("secondsInput");
const muteBtn = document.getElementById("muteBtn");

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString("es-ES", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });
}

setInterval(updateClock, 1000);
updateClock();

function readSelectedTime() {
    const min = parseInt(minutesInput.value) || 0;
    const sec = parseInt(secondsInput.value) || 0;

    totalSeconds = (min * 60) + sec;

    if (totalSeconds <= 0) {
        totalSeconds = 300;
        minutesInput.value = 5;
        secondsInput.value = 0;
    }

    remainingSeconds = totalSeconds;
}

function formatTime(seconds) {
    const sign = seconds < 0 ? "+" : "";
    const absSeconds = Math.abs(seconds);
    const min = Math.floor(absSeconds / 60);
    const sec = absSeconds % 60;

    return sign +
        String(min).padStart(2, "0") + ":" +
        String(sec).padStart(2, "0");
}

function updateTimerDisplay() {
    timerDisplay.textContent = formatTime(remainingSeconds);
    timerDisplay.classList.remove("blink", "overtime");

    if (remainingSeconds <= 10 && remainingSeconds > 0) {
        timerDisplay.classList.add("blink");
        statusDisplay.textContent = "Finalizando...";
    }

    if (remainingSeconds === 0) {
        statusDisplay.textContent = "Tiempo finalizado";
    }

    if (remainingSeconds < 0) {
        timerDisplay.classList.add("overtime");
        statusDisplay.textContent = "Tiempo excedido";
    }
}

function toggleTimer() {
    if (interval) {
        clearInterval(interval);
        interval = null;
        statusDisplay.textContent = "Pausado";
        return;
    }

    if (remainingSeconds === totalSeconds && !alarmPlayed) {
        readSelectedTime();
    }

    statusDisplay.textContent = "En curso";

    interval = setInterval(() => {
        remainingSeconds--;

        if (remainingSeconds === 0 && !alarmPlayed) {
            alarmPlayed = true;
            playAlarm();
        }

        updateTimerDisplay();
    }, 1000);
}

function resetTimer() {
    clearInterval(interval);
    interval = null;
    readSelectedTime();
    alarmPlayed = false;
    statusDisplay.textContent = "Preparado";
    updateTimerDisplay();
}

function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇 Silenciado" : "🔊 Sonido ON";
}

function playAlarm() {
    if (muted) return;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    for (let i = 0; i < 5; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 900;
        osc.type = "square";

        osc.start(audioCtx.currentTime + i * 0.35);
        osc.stop(audioCtx.currentTime + i * 0.35 + 0.22);
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

minutesInput.addEventListener("change", resetTimer);
secondsInput.addEventListener("change", resetTimer);

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        toggleTimer();
    }

    if (e.key.toLowerCase() === "r") resetTimer();
    if (e.key.toLowerCase() === "f") toggleFullscreen();
    if (e.key.toLowerCase() === "m") toggleMute();
});

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

updateTimerDisplay();
</script>

</body>
</html>
